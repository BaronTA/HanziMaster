<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarin 100</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="fx-canvas"></canvas>

    <div id="app">
        <!-- Header & Stats -->
        <header>
            <h1>MANDARIN 100</h1>
            <div id="stats">
                <span id="counter">01 / 100</span>
                <span id="timer">0.0s</span>
                <span id="pb">PB: --</span>
            </div>
        </header>

        <!-- Centered 100-Dot Visual Progress Track -->
        <div id="progress-track"></div>

        <!-- Core Game Container -->
        <main id="game-container">
            <div id="prompt-box">
                <div id="prompt-type-indicator"></div>
                <div id="prompt-display"></div>
            </div>

            <div id="interaction-box">
                <!-- Dynamically Rendered -->
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
